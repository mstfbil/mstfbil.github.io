<h2>posts</h2>

<ul class="posts-list">
    {%- for post in collections.posts reversed -%}
    <li>
        <a href="{{ post.url }}"
            >{{ post.data.title }} - {{ post.date | date: "%B %d, %y" }}</a
        >
    </li>
    {%- endfor -%}
</ul>
